[metadata]
name = aqorath
version = attr: aqorath.version.__version__
description = ERP contable profesional local-first y explicable

[options]
packages = find:
python_requires = >=3.12
include_package_data = True
zip_safe = False
install_requires =
    openpyxl>=3.0
    reportlab>=4.0
    lxml>=4.9
    sqlmodel
    sqlalchemy
    fastapi
    uvicorn

[options.package_data]
aqorath =
    data/*.json

[options.entry_points]
console_scripts =
    aqorath = aqorath.entrypoint:main

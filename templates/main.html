<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Aqorath - Principal</title>
    <link rel="stylesheet" href="/static/main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <div class="page-wrap">
        <div class="seal-wrap">
            <img src="/static/ac_seal.png" alt="Sello AC" class="ac-seal">
        </div>

        <div class="bottom-left-phrase">
            La fuerza interior nos impulsa, un pequeño apoyo de los demás nos bendice
        </div>

        {% if company %}
        <div class="company-banner">
            <div class="company-info">
                <h2>{{ company.name }}</h2>
                <div>{{ company.denominacion or "" }}</div>
                <div>RFC: {{ company.rfc or "" }}</div>
            </div>
            {% if company.logo_path %}
            <div class="company-logo">
                <img src="/company/{{ company.id }}/logo" alt="Company logo" />
            </div>
            {% endif %}
        </div>
        {% endif %}
    </div>
</body>

</html>

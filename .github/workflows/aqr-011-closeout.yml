name: AQR-011 closeout

on:
  push:
    branches:
      - aqr-011-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aqr-011-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch authoritative documents
        run: python scripts/aqr_011_closeout.py
      - name: Commit closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INSTRUCCIONES.md docs/PRODUCT_BACKLOG_V1.md docs/REPO_AUDIT_V2.md
          git diff --cached --check
          git commit -m "docs: close AQR-011 and advance to AQR-012"
          git push origin HEAD:aqr-011-closeout

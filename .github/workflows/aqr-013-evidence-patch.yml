name: AQR-013 evidence patch

on:
  push:
    branches: [aqr-013-reporting-engine]
    paths:
      - scripts/aqr_013_evidence_patch.py
      - .github/workflows/aqr-013-evidence-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aqr-013-reporting-engine
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: python scripts/aqr_013_evidence_patch.py
      - name: Commit effective patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aqorath/report_authority_views.py tests/test_aqr013_reporting_engine.py
          git rm scripts/aqr_013_evidence_patch.py .github/workflows/aqr-013-evidence-patch.yml
          git commit -m "fix(aqr-013): report current CFDI evidence and catalog contract"
          git push origin HEAD:aqr-013-reporting-engine

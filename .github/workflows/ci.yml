name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show workspace contents (diagnostic)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          echo "Top-level entries:"
          ls -la
          echo "aqorath directory entries:"
          ls -la aqorath || true
          echo "Check for governed catalog JSON:"
          test -f aqorath/data/catalogo_base.json

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development and product dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run source-tree tests
        env:
          AQORATH_DB: ${{ github.workspace }}/tests/test.db
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python -m pytest -x -vv --tb=short > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          exit $status

      - name: Upload pytest diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: error

      - name: Build sdist and wheel once
        run: |
          rm -rf dist build aqorath.egg-info
          python -m build --sdist --wheel
          ls -lh dist

      - name: Smoke installed distribution outside checkout
        run: |
          WHEEL="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          SDIST="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$WHEEL"
          test -n "$SDIST"
          set +e
          python scripts/verify_distribution.py --wheel "$WHEEL" --sdist "$SDIST" > distribution-smoke-output.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python scripts/verify_pre_release_hardening.py --wheel "$WHEEL" >> distribution-smoke-output.txt 2>&1
            status=$?
          fi
          cat distribution-smoke-output.txt
          exit $status

      - name: Upload distribution smoke diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-smoke-output
          path: distribution-smoke-output.txt
          if-no-files-found: error

      - name: Exercise installed V1 acceptance flows offline
        run: |
          WHEEL="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          set +e
          python scripts/verify_installed_v1.py --wheel "$WHEEL" > installed-v1-output.txt 2>&1
          status=$?
          cat installed-v1-output.txt
          exit $status

      - name: Upload installed V1 acceptance diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-v1-output
          path: installed-v1-output.txt
          if-no-files-found: error

      - name: Prepare downloadable V1 candidate
        if: success()
        run: |
          WHEEL="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          sha256sum "$WHEEL" > dist/SHA256SUMS.txt
          cat > dist/LEEME.txt <<'EOF'
          AQORATH V1 — CANDIDATO TÉCNICO

          Este paquete fue construido por el mismo CI que ejecuta la suite fuente,
          el smoke de distribución, el hardening pre-release y la aceptación
          instalada offline de Aqorath V1.

          Estado al publicarse este artifact:
          - TECHNICAL_INSTALLED: 22/22 PASS
          - PROFESSIONAL_REVIEW: PENDING
          - HUMAN_ACCEPTANCE: PENDING
          - No es todavía una release V1 final.

          El archivo .whl es el paquete instalable de Aqorath.
          SHA256SUMS.txt permite verificar su integridad.
          EOF

      - name: Publish downloadable Aqorath V1 candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aqorath-v1-candidate
          path: |
            dist/*.whl
            dist/SHA256SUMS.txt
            dist/LEEME.txt
          if-no-files-found: error
          retention-days: 90

  windows-installer:
    name: Windows native installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Download accepted wheel from this run
        uses: actions/download-artifact@v4
        with:
          name: aqorath-v1-candidate
          path: candidate

      - name: Install accepted product and pinned native toolchain
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          $wheel = (Get-ChildItem "$env:GITHUB_WORKSPACE\candidate\*.whl" | Select-Object -First 1).FullName
          if (-not $wheel) { throw "Accepted Aqorath wheel was not downloaded" }
          python -m pip install "$wheel"
          python -m pip install -r requirements-native.txt

      - name: Smoke native shell before freezing
        shell: pwsh
        run: |
          python -c "from aqorath.desktop_entrypoint import main; raise SystemExit(main(['--self-test']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from aqorath.desktop_entrypoint import main; raise SystemExit(main(['--gui-import-test']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Freeze Aqorath desktop application
        shell: pwsh
        run: |
          $repo = $env:GITHUB_WORKSPACE
          $nativeBuild = Join-Path $repo "packaging\windows\build"
          $pyiRoot = Join-Path $env:RUNNER_TEMP "aqorath-pyinstaller"
          Remove-Item $nativeBuild -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $pyiRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $nativeBuild -Force | Out-Null
          New-Item -ItemType Directory -Path $pyiRoot -Force | Out-Null
          Push-Location $pyiRoot
          python -m PyInstaller `
            "$repo\packaging\windows\native_launcher.py" `
            --noconfirm `
            --clean `
            --windowed `
            --name Aqorath `
            --distpath "$nativeBuild" `
            --workpath "$pyiRoot\work" `
            --specpath "$pyiRoot\spec" `
            --collect-all aqorath `
            --collect-all webview `
            --collect-submodules uvicorn `
            --hidden-import aqorath.web_surface
          $status = $LASTEXITCODE
          Pop-Location
          if ($status -ne 0) { exit $status }
          if (-not (Test-Path "$nativeBuild\Aqorath\Aqorath.exe")) {
            throw "PyInstaller did not produce Aqorath.exe"
          }

      - name: Smoke frozen executable
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\packaging\windows\build\Aqorath\Aqorath.exe"
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --gui-import-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $repo = $env:GITHUB_WORKSPACE
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          Remove-Item "$repo\packaging\windows\output" -Recurse -Force -ErrorAction SilentlyContinue
          & $iscc "$repo\packaging\windows\Aqorath.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$repo\packaging\windows\output\Aqorath-Setup-V1-Candidate.exe")) {
            throw "Inno Setup did not produce the installer"
          }

      - name: Install and smoke the actual Setup.exe
        shell: pwsh
        run: |
          $installer = "$env:GITHUB_WORKSPACE\packaging\windows\output\Aqorath-Setup-V1-Candidate.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "AqorathInstalled"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $args = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installDir")
          $process = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $installedExe = Join-Path $installDir "Aqorath.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed Aqorath.exe not found" }
          & $installedExe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installedExe --gui-import-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare direct-download Windows candidate
        shell: pwsh
        run: |
          $source = "$env:GITHUB_WORKSPACE\packaging\windows\output\Aqorath-Setup-V1-Candidate.exe"
          $releaseDir = "$env:GITHUB_WORKSPACE\native-release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item $source "$releaseDir\Aqorath-Setup-V1-Candidate.exe"
          $hash = (Get-FileHash "$releaseDir\Aqorath-Setup-V1-Candidate.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Aqorath-Setup-V1-Candidate.exe" | Set-Content "$releaseDir\SHA256SUMS.txt" -Encoding ascii
          @'
          AQORATH V1 — INSTALADOR WINDOWS, CANDIDATO TÉCNICO

          Uso normal:
          1. Haz doble clic en Aqorath-Setup-V1-Candidate.exe.
          2. Sigue el asistente de instalación.
          3. Al terminar, Aqorath puede abrirse desde el Escritorio o el menú Inicio.

          No requiere instalar Python, pip ni abrir PowerShell.

          Estado de este candidato:
          - TECHNICAL_INSTALLED: 22/22 PASS
          - PROFESSIONAL_REVIEW: PENDING
          - HUMAN_ACCEPTANCE: PENDING
          - No es todavía la release V1 final.

          Firma:
          Este candidato todavía no tiene firma Authenticode. Windows SmartScreen
          puede mostrar "editor desconocido" hasta que la release final se firme.
          '@ | Set-Content "$releaseDir\LEEME-WINDOWS.txt" -Encoding utf8

      - name: Publish Windows double-click installer
        uses: actions/upload-artifact@v4
        with:
          name: aqorath-windows-installer
          path: |
            native-release/Aqorath-Setup-V1-Candidate.exe
            native-release/SHA256SUMS.txt
            native-release/LEEME-WINDOWS.txt
          if-no-files-found: error
          retention-days: 90

  android-apk:
    name: Android local-first APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Enable Android hardware acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download exact accepted wheel from this run
        uses: actions/download-artifact@v4
        with:
          name: aqorath-v1-candidate
          path: packaging/android/candidate

      - name: Verify Android consumes the accepted wheel
        run: |
          test -f packaging/android/candidate/aqorath-0+aqr015-py3-none-any.whl
          ls -lh packaging/android/candidate

      - name: Build installable Android APK
        run: |
          gradle -p packaging/android :app:assembleDebug --stacktrace
          test -f packaging/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh packaging/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Install and airplane-smoke APK in clean emulator
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/packaging/android/app/build/outputs/apk/debug/app-debug.apk"
          EMULATOR_LOG="$GITHUB_WORKSPACE/android-emulator.txt"
          LOGCAT="$GITHUB_WORKSPACE/android-logcat.txt"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          SDKMANAGER_PATH="$(command -v sdkmanager)"
          AVDMANAGER="$(dirname "$SDKMANAGER_PATH")/avdmanager"
          test -x "$AVDMANAGER"
          echo "Using AVD manager: $AVDMANAGER"

          printf 'no\n' | "$AVDMANAGER" create avd \
            --force \
            --name aqorath-ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --path "$ANDROID_AVD_HOME/aqorath-ci.avd"

          echo "AVD manager inventory:"
          "$AVDMANAGER" list avd
          echo "Emulator inventory:"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          ls -la "$ANDROID_AVD_HOME"
          test -f "$ANDROID_AVD_HOME/aqorath-ci.ini"

          "$ANDROID_HOME/emulator/emulator" -avd aqorath-ci \
            -no-window \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -accel on \
            > "$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          booted=0
          for attempt in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" >/dev/null 2>&1; then
              echo "Android emulator process exited before boot completed" >&2
              cat "$EMULATOR_LOG" || true
              exit 1
            fi
            state="$(adb get-state 2>/dev/null || true)"
            completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = "device" ] && [ "$completed" = "1" ]; then
              booted=1
              break
            fi
            sleep 2
          done
          if [ "$booted" -ne 1 ]; then
            echo "Android emulator did not finish booting" >&2
            cat "$EMULATOR_LOG" || true
            adb logcat -d || true
            exit 1
          fi

          sleep 20
          adb shell echo AQORATH_ADB_READY
          adb install -r "$APK"
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          adb shell settings put global airplane_mode_on 1
          adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true >/dev/null || true
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = "1"

          adb logcat -c
          adb shell am force-stop org.meriadock.aqorath || true
          adb shell am start -W -n org.meriadock.aqorath/.MainActivity

          ready=0
          for attempt in $(seq 1 90); do
            adb logcat -d > "$LOGCAT"
            if grep -q 'AQORATH_ANDROID_READY=' "$LOGCAT"; then
              ready=1
              break
            fi
            if grep -q 'AQORATH_ANDROID_ERROR' "$LOGCAT"; then
              cat "$LOGCAT"
              exit 1
            fi
            sleep 2
          done
          cat "$LOGCAT"
          test "$ready" -eq 1
          grep -q 'AQORATH_ANDROID_NETWORK_GUARD=loopback-only' "$LOGCAT"
          adb shell run-as org.meriadock.aqorath sh -c 'test -f files/aqorath/aqorath.db'

          adb forward tcp:18765 tcp:8765
          python - <<'PY'
          import json
          from urllib.request import urlopen
          with urlopen('http://127.0.0.1:18765/api/capabilities', timeout=10) as response:
              payload = json.load(response)
          if not isinstance(payload, (dict, list)):
              raise SystemExit('unexpected capabilities payload')
          print('AQR-015 Android airplane-mode local surface: OK')
          PY

      - name: Upload Android diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-airplane-smoke-output
          path: |
            android-logcat.txt
            android-emulator.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Prepare direct-download Android candidate
        if: success()
        run: |
          mkdir -p android-release
          cp packaging/android/app/build/outputs/apk/debug/app-debug.apk \
            android-release/Aqorath-Android-V1-Candidate.apk
          sha256sum android-release/Aqorath-Android-V1-Candidate.apk \
            > android-release/SHA256SUMS.txt
          cat > android-release/LEEME-ANDROID.txt <<'EOF'
          AQORATH V1 — ANDROID LOCAL-FIRST, CANDIDATO TÉCNICO

          Instalación de prueba:
          1. Descarga Aqorath-Android-V1-Candidate.apk en un teléfono Android.
          2. Android puede pedir autorización para instalar apps desde esa fuente.
          3. Instala y abre Aqorath.

          Aqorath vive en el teléfono:
          - SQLite se guarda en el sandbox privado de la app.
          - no existe backend Meriadock para datos contables;
          - el runtime Python bloquea destinos de red no-loopback;
          - la WebView sólo permite la superficie local del mismo dispositivo;
          - CI acreditó arranque y uso local con modo avión habilitado.

          Estado:
          - canonical wheel TECHNICAL_INSTALLED: 22/22 PASS
          - Android airplane-mode packaging smoke: PASS
          - PROFESSIONAL_REVIEW: PENDING
          - HUMAN_ACCEPTANCE: PENDING
          - no es todavía la release V1 final.

          Firma:
          Este APK candidato usa la firma debug de Android generada por CI. La
          release pública requerirá una clave de firma estable y controlada.
          EOF

      - name: Publish Android local-first APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aqorath-android-apk
          path: |
            android-release/Aqorath-Android-V1-Candidate.apk
            android-release/SHA256SUMS.txt
            android-release/LEEME-ANDROID.txt
          if-no-files-found: error
          retention-days: 90

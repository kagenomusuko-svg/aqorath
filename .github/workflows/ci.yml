name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show workspace contents (diagnostic)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          echo "Top-level entries:"
          ls -la
          echo "aqorath directory entries:"
          ls -la aqorath || true
          echo "Check for governed catalog JSON:"
          test -f aqorath/data/catalogo_base.json

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development and product dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run source-tree tests
        env:
          AQORATH_DB: ${{ github.workspace }}/tests/test.db
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python -m pytest -x -vv --tb=short > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          exit $status

      - name: Upload pytest diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: error

      - name: Build sdist and wheel once
        run: |
          rm -rf dist build aqorath.egg-info
          python -m build --sdist --wheel
          ls -lh dist

      - name: Smoke installed distribution outside checkout
        run: |
          WHEEL="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          SDIST="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$WHEEL"
          test -n "$SDIST"
          set +e
          python scripts/verify_distribution.py --wheel "$WHEEL" --sdist "$SDIST" > distribution-smoke-output.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python scripts/verify_pre_release_hardening.py --wheel "$WHEEL" >> distribution-smoke-output.txt 2>&1
            status=$?
          fi
          cat distribution-smoke-output.txt
          exit $status

      - name: Upload distribution smoke diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-smoke-output
          path: distribution-smoke-output.txt
          if-no-files-found: error

      - name: Exercise installed V1 acceptance flows offline
        run: |
          WHEEL="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          set +e
          python scripts/verify_installed_v1.py --wheel "$WHEEL" > installed-v1-output.txt 2>&1
          status=$?
          cat installed-v1-output.txt
          exit $status

      - name: Upload installed V1 acceptance diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-v1-output
          path: installed-v1-output.txt
          if-no-files-found: error

      - name: Prepare downloadable V1 candidate
        if: success()
        run: |
          WHEEL="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          sha256sum "$WHEEL" > dist/SHA256SUMS.txt
          cat > dist/LEEME.txt <<'EOF'
          AQORATH V1 — CANDIDATO TÉCNICO

          Este paquete fue construido por el mismo CI que ejecuta la suite fuente,
          el smoke de distribución, el hardening pre-release y la aceptación
          instalada offline de Aqorath V1.

          Estado al publicarse este artifact:
          - TECHNICAL_INSTALLED: 22/22 PASS
          - PROFESSIONAL_REVIEW: PENDING
          - HUMAN_ACCEPTANCE: PENDING
          - No es todavía una release V1 final.

          El archivo .whl es el paquete instalable de Aqorath.
          SHA256SUMS.txt permite verificar su integridad.
          EOF

      - name: Publish downloadable Aqorath V1 candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aqorath-v1-candidate
          path: |
            dist/*.whl
            dist/SHA256SUMS.txt
            dist/LEEME.txt
          if-no-files-found: error
          retention-days: 90

  windows-installer:
    name: Windows native installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Download accepted wheel from this run
        uses: actions/download-artifact@v4
        with:
          name: aqorath-v1-candidate
          path: candidate

      - name: Install accepted product and pinned native toolchain
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          $wheel = (Get-ChildItem "$env:GITHUB_WORKSPACE\candidate\*.whl" | Select-Object -First 1).FullName
          if (-not $wheel) { throw "Accepted Aqorath wheel was not downloaded" }
          python -m pip install "$wheel"
          python -m pip install -r requirements-native.txt

      - name: Smoke native shell before freezing
        shell: pwsh
        run: |
          python -c "from aqorath.desktop_entrypoint import main; raise SystemExit(main(['--self-test']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from aqorath.desktop_entrypoint import main; raise SystemExit(main(['--gui-import-test']))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Freeze Aqorath desktop application
        shell: pwsh
        run: |
          $repo = $env:GITHUB_WORKSPACE
          $nativeBuild = Join-Path $repo "packaging\windows\build"
          $pyiRoot = Join-Path $env:RUNNER_TEMP "aqorath-pyinstaller"
          Remove-Item $nativeBuild -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $pyiRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $nativeBuild -Force | Out-Null
          New-Item -ItemType Directory -Path $pyiRoot -Force | Out-Null
          Push-Location $pyiRoot
          python -m PyInstaller `
            "$repo\packaging\windows\native_launcher.py" `
            --noconfirm `
            --clean `
            --windowed `
            --name Aqorath `
            --distpath "$nativeBuild" `
            --workpath "$pyiRoot\work" `
            --specpath "$pyiRoot\spec" `
            --collect-all aqorath `
            --collect-all webview `
            --collect-submodules uvicorn `
            --hidden-import aqorath.web_surface
          $status = $LASTEXITCODE
          Pop-Location
          if ($status -ne 0) { exit $status }
          if (-not (Test-Path "$nativeBuild\Aqorath\Aqorath.exe")) {
            throw "PyInstaller did not produce Aqorath.exe"
          }

      - name: Smoke frozen executable
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\packaging\windows\build\Aqorath\Aqorath.exe"
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --gui-import-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $repo = $env:GITHUB_WORKSPACE
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          Remove-Item "$repo\packaging\windows\output" -Recurse -Force -ErrorAction SilentlyContinue
          & $iscc "$repo\packaging\windows\Aqorath.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$repo\packaging\windows\output\Aqorath-Setup-V1-Candidate.exe")) {
            throw "Inno Setup did not produce the installer"
          }

      - name: Install and smoke the actual Setup.exe
        shell: pwsh
        run: |
          $installer = "$env:GITHUB_WORKSPACE\packaging\windows\output\Aqorath-Setup-V1-Candidate.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "AqorathInstalled"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $args = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installDir")
          $process = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $installedExe = Join-Path $installDir "Aqorath.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed Aqorath.exe not found" }
          & $installedExe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $installedExe --gui-import-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare direct-download Windows candidate
        shell: pwsh
        run: |
          $source = "$env:GITHUB_WORKSPACE\packaging\windows\output\Aqorath-Setup-V1-Candidate.exe"
          $releaseDir = "$env:GITHUB_WORKSPACE\native-release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item $source "$releaseDir\Aqorath-Setup-V1-Candidate.exe"
          $hash = (Get-FileHash "$releaseDir\Aqorath-Setup-V1-Candidate.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Aqorath-Setup-V1-Candidate.exe" | Set-Content "$releaseDir\SHA256SUMS.txt" -Encoding ascii
          @'
          AQORATH V1 — INSTALADOR WINDOWS, CANDIDATO TÉCNICO

          Uso normal:
          1. Haz doble clic en Aqorath-Setup-V1-Candidate.exe.
          2. Sigue el asistente de instalación.
          3. Al terminar, Aqorath puede abrirse desde el Escritorio o el menú Inicio.

          No requiere instalar Python, pip ni abrir PowerShell.

          Estado de este candidato:
          - TECHNICAL_INSTALLED: 22/22 PASS
          - PROFESSIONAL_REVIEW: PENDING
          - HUMAN_ACCEPTANCE: PENDING
          - No es todavía la release V1 final.

          Firma:
          Este candidato todavía no tiene firma Authenticode. Windows SmartScreen
          puede mostrar "editor desconocido" hasta que la release final se firme.
          '@ | Set-Content "$releaseDir\LEEME-WINDOWS.txt" -Encoding utf8

      - name: Publish Windows double-click installer
        uses: actions/upload-artifact@v4
        with:
          name: aqorath-windows-installer
          path: |
            native-release/Aqorath-Setup-V1-Candidate.exe
            native-release/SHA256SUMS.txt
            native-release/LEEME-WINDOWS.txt
          if-no-files-found: error
          retention-days: 90

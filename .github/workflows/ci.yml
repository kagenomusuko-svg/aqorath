name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show workspace contents (diagnostic)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          echo "Top-level entries:"
          ls -la
          echo "aqorath directory entries:"
          ls -la aqorath || true
          echo "Check for governed catalog JSON:"
          test -f aqorath/data/catalogo_base.json

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development and product dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run source-tree tests
        env:
          AQORATH_DB: ${{ github.workspace }}/tests/test.db
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -v

      - name: Build sdist and wheel once
        run: |
          rm -rf dist build aqorath.egg-info
          python -m build --sdist --wheel
          ls -lh dist

      - name: Smoke installed distribution outside checkout
        run: |
          WHEEL="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          SDIST="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$WHEEL"
          test -n "$SDIST"
          python scripts/verify_distribution.py --wheel "$WHEEL" --sdist "$SDIST"

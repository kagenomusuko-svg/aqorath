name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Apply and persist AQR-012 audit-order patch
        run: |
          python scripts/aqr012_stage_entry_audit_patch.py
          if git diff --quiet -- aqorath/inventory_operations.py; then
            echo "Patch already persisted"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add aqorath/inventory_operations.py
            git commit -m "fix: stage canonical inventory posting audit before CFDI link"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Show workspace contents (diagnostic)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          echo "Top-level entries:"
          ls -la
          echo "aqorath directory entries:"
          ls -la aqorath || true
          echo "Check for catalog JSON:"
          if [ -f "aqorath/data/catalogo_base.json" ]; then
            echo "FOUND: aqorath/data/catalogo_base.json"
            head -n 20 aqorath/data/catalogo_base.json || true
          else
            echo "NOT FOUND: aqorath/data/catalogo_base.json"
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          pip install -e .

      - name: Ensure catalog JSON exists
        run: |
          set -euo pipefail
          if [ -f "aqorath/data/catalogo_base.json" ]; then
            echo "Catalog JSON already present"
          else
            echo "Catalog JSON missing — creating minimal JSON"
            mkdir -p aqorath/data
            python -c 'import json,os; os.makedirs("aqorath/data", exist_ok=True); json.dump({"version":"generated-for-ci","notes":"Auto-generated minimal catalog to allow tests in CI","accounts":{}}, open("aqorath/data/catalogo_base.json","w"))'
          fi
          echo "Listing aqorath/data:"
          ls -la aqorath/data || true

      - name: Run tests
        env:
          AQORATH_DB: ${{ github.workspace }}/tests/test.db
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python -m pytest -x -vv --tb=short > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          exit $status

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt

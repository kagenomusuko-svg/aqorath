name: Build Aqorath Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --clean --noconfirm --paths . --name Aqorath --onefile --windowed --collect-all uvicorn --collect-submodules fastapi --collect-submodules starlette --hidden-import aqorath.web_surface --hidden-import aqorath.recovery_web scripts/aqorath_launcher.py

      - name: Smoke-test packaged desktop application
        shell: pwsh
        run: |
          $env:AQORATH_NO_BROWSER = "1"
          $env:AQORATH_DATA_DIR = Join-Path $env:RUNNER_TEMP "aqorath-desktop-smoke"
          if (Test-Path $env:AQORATH_DATA_DIR) {
            Remove-Item -Recurse -Force $env:AQORATH_DATA_DIR
          }

          $process = Start-Process -FilePath "$PWD\dist\Aqorath.exe" -PassThru
          $ready = $false
          try {
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                Write-Host "Aqorath.exe exited during startup with code $($process.ExitCode)."
                exit 1
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8765/?module=operations" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                # Server is still starting; retry until the bounded deadline.
              }
            }

            if (-not $ready) {
              Write-Host "Aqorath.exe did not expose the local surface within 45 seconds."
              exit 1
            }

            if ($response.Content -notmatch 'id="aq-sidebar"') {
              Write-Host "Desktop navigation shell was not rendered."
              exit 1
            }

            $dbPath = Join-Path $env:AQORATH_DATA_DIR "aqorath.db"
            $trial = Invoke-WebRequest -Uri "http://127.0.0.1:8765/api/trial-balance" -UseBasicParsing -TimeoutSec 10
            if ($trial.StatusCode -ne 200) {
              Write-Host "Trial balance endpoint failed with HTTP $($trial.StatusCode)."
              exit 1
            }

            if (-not (Test-Path $dbPath)) {
              Write-Host "Aqorath did not create its writable SQLite database at $dbPath."
              exit 1
            }

            $integrity = Invoke-WebRequest -Uri "http://127.0.0.1:8765/api/system/integrity" -UseBasicParsing -TimeoutSec 10
            if ($integrity.StatusCode -ne 200) {
              Write-Host "Integrity endpoint failed with HTTP $($integrity.StatusCode)."
              exit 1
            }

            Write-Host "Packaged Aqorath passed desktop shell, SQLite persistence, trial balance, and integrity smoke tests."
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Aqorath-Windows
          path: dist/Aqorath.exe
          if-no-files-found: error

name: AQR-013 schema expectation patch

on:
  push:
    branches: [aqr-013-reporting-engine]
    paths:
      - scripts/aqr_013_schema6_expectation_patch.py
      - .github/workflows/aqr-013-schema6-expectation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aqr-013-reporting-engine
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: python scripts/aqr_013_schema6_expectation_patch.py
      - name: Commit effective patch and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_aqr006_subledger.py
          git rm scripts/aqr_013_schema6_expectation_patch.py .github/workflows/aqr-013-schema6-expectation-patch.yml
          git commit -m "test(aqr-013): include schema 13 preset tables in historical migration expectation"
          git push origin HEAD:aqr-013-reporting-engine

name: AQR-013 closeout patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aqr-013-closeout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply closeout patch
        run: python scripts/aqr_013_closeout_patch.py
      - name: Commit closeout docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRODUCT_BACKLOG_V1.md INSTRUCCIONES.md docs/REPO_AUDIT_V2.md
          git diff --cached --check
          git commit -m "docs: close AQR-013 and advance AQR-014"
          git push origin HEAD:aqr-013-closeout

name: AQR-012 schema patch

on:
  push:
    branches:
      - aqr-012-inventory-costs

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'schema 12 inventory') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aqr-012-inventory-costs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/aqr_012_schema_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aqorath/migrations.py
          git diff --cached --check
          git commit -m "feat: add schema 12 inventory migration"
          git push origin HEAD:aqr-012-inventory-costs

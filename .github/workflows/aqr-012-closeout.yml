name: AQR-012 governance closeout

on:
  push:
    branches: [aqr-012-closeout]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply governance closeout
        run: python scripts/aqr_012_closeout.py
      - name: Commit governance state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/aqr-012-closeout.yml scripts/aqr_012_closeout.py
          git add docs/PRODUCT_BACKLOG_V1.md INSTRUCCIONES.md docs/REPO_AUDIT_V2.md
          git commit -m "docs: close AQR-012 and advance AQR-013"
          git push origin HEAD:aqr-012-closeout
